<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="icon" href="favicon.ico">
    
  </head>
  <body>
    <button type="button" class="drum-pad" data-key="a" data-sound="sounds/kick.wav">A</button>
    <button type="button" class="drum-pad" data-key="s" data-sound="sounds/snare.wav">S</button>
    <button type="button" class="drum-pad" data-key="d" data-sound="sounds/hihat.wav">D</button>
    <button type="button" class="drum-pad" data-key="f" data-sound="sounds/clap.wav">F</button>
    <button type="button" class="drum-pad" data-key="g" data-sound="sounds/tom.wav">G</button>
    <button type="button" class="drum-pad" data-key="h" data-sound="sounds/crash.wav">H</button>
    <button type="button" class="drum-pad" data-key="j" data-sound="sounds/ride.wav">J</button>
    <button type="button" class="drum-pad" data-key="k" data-sound="sounds/cowbell.wav">K</button>
    <button type="button" class="drum-pad" data-key="l" data-sound="sounds/rim.wav">L</button>
    <script type="module" src="main.js"></script>
  </body>
</html>
