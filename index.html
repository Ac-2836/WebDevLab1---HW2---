<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css"> 
  </head>
  <body>
    <button type="button" id="record-btn">Record</button>
    <button type="button" class="drum-pad" data-key="a" data-sound="sounds/kick.wav"><span aria-hidden="true">A</span><span>Kick</span></button>
    <button type="button" class="drum-pad" data-key="s" data-sound="sounds/snare.wav"><span aria-hidden="true">S</span><span>Snare</span></button>
    <button type="button" class="drum-pad" data-key="d" data-sound="sounds/hihat.wav"><span aria-hidden="true">D</span><span>Hihat</span></button>
    <button type="button" class="drum-pad" data-key="f" data-sound="sounds/clap.wav"><span aria-hidden="true">F</span><span>Clap</span></button>
    <button type="button" class="drum-pad" data-key="g" data-sound="sounds/tom.wav"><span aria-hidden="true">G</span><span>Tom</span></button>
    <button type="button" class="drum-pad" data-key="h" data-sound="sounds/crash.wav"><span aria-hidden="true">H</span><span>Crash</span></button>
    <button type="button" class="drum-pad" data-key="j" data-sound="sounds/ride.wav"><span aria-hidden="true">J</span><span>Ride</span></button>
    <button type="button" class="drum-pad" data-key="k" data-sound="sounds/cowbell.wav"><span aria-hidden="true">K</span><span>Cowbell</span></button>
    <button type="button" class="drum-pad" data-key="l" data-sound="sounds/rim.wav"><span aria-hidden="true">L</span><span>Rim</span></button>
    <section id="record-log" aria-label="Latest recording"></section>
    <script type="module" src="main.js"></script>
  </body>
</html>
